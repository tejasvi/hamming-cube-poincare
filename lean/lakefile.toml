name = "Poincare11a"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Poincare11a"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
autoImplicit = false
weak.linter.style.header = false

# L^1 Poincare inequality on the Hamming cube with constant 71/50.
# Toolchain leanprover/lean4:v4.35.0-rc3; Mathlib at tag v4.35.0-rc3 (commit c55e6e786f49, see lake-manifest.json).
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

[[lean_lib]]
name = "Poincare11a"
globs = ["Poincare11a.+"]
